services:

  postgres:
    image: postgres:17
    container_name: docker-postgres-1

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: retail_db

    ports:
      - "5432:5432"

  redis:
    image: redis:8
    container_name: docker-redis-1

    ports:
      - "6379:6379"

  mlflow:
    image: ghcr.io/mlflow/mlflow
    container_name: docker-mlflow-1

    command: mlflow ui --host 0.0.0.0

    ports:
      - "5000:5000"

  airflow:
    image: apache/airflow:2.9.0
    container_name: docker-airflow-1

    command: standalone

    ports:
      - "8080:8080"

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    volumes:
      - ../src/airflow:/opt/airflow/dags

    depends_on:
      - postgres
      - redis