[project]
name = "retail-analytics-platform"
version = "0.1.0"
description = ""
authors = [
    { name = "SantoshKumarNeyyala", email = "nsantosh5885@gmail.com" }
]
requires-python = ">=3.10,<3.12"

dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.3.2",
    "matplotlib==3.8.4",
    "seaborn==0.13.2",
    "fastapi==0.110.0",
    "uvicorn (>=0.46.0,<0.47.0)",
    "pyspark==3.5.1",
    "boto3==1.34.122",
    "python-dotenv==1.0.1",
    "openpyxl==3.1.2",
    "pyarrow (==12.0.1)",
    "mlflow (>=3.12.0,<4.0.0)",
    "streamlit (>=1.36,<2.0)",
    "plotly (>=6.7.0,<7.0.0)",
    "apache-airflow (==2.9.0)",
    "optuna (>=4.8.0,<5.0.0)",
    "lightgbm (>=4.6.0,<5.0.0)",
    "prophet (>=1.3.0,<2.0.0)",
    "shap (==0.44.1)",
    "imbalanced-learn (==0.11.0)",
    "xgboost (==1.7.6)",
    "statsmodels (>=0.14.6,<0.15.0)",
    "streamlit-authenticator (>=0.4.2,<0.5.0)",
    "streamlit-option-menu (>=0.4.0,<0.5.0)",
    "reportlab (>=4.5.0,<5.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "black==24.4.2",
    "ruff==0.4.4",
    "pytest==8.2.2",
    "pre-commit==3.7.1"
]