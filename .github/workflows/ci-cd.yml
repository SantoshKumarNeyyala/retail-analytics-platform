name: Retail Analytics CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install ruff black

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run Black
        run: |
          black --check .

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Requirements
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Tests
        run: |
          pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build FastAPI Image
        run: |
          docker build -f docker/fastapi/Dockerfile -t retail-fastapi:${{ github.sha }} .

      - name: Build Streamlit Image
        run: |
          docker build -f docker/streamlit/Dockerfile -t retail-streamlit:${{ github.sha }} .