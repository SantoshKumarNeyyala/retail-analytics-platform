name: Retail Analytics CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install ruff==0.4.4 black==24.4.2

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run Black
        run: |
          black --check .

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Requirements
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Tests
        run: |
          pytest
      
      - name: Model Validation Gate
        run: |
          python scripts/model_validation.py

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build FastAPI Image
        run: |
          docker build -f docker/fastapi/Dockerfile -t retail-fastapi:${{ github.sha }} .

      - name: Build Streamlit Image
        run: |
          docker build -f docker/streamlit/Dockerfile -t retail-streamlit:${{ github.sha }} .
  
  docker-push:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push FastAPI
        run: |
          docker build -f docker/fastapi/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/retail-fastapi:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/retail-fastapi:${{ github.sha }}

      - name: Build and Push Streamlit
        run: |
          docker build -f docker/streamlit/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/retail-streamlit:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/retail-streamlit:${{ github.sha }}