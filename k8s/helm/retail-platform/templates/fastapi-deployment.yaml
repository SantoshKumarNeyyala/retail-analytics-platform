apiVersion: apps/v1
kind: Deployment

metadata:
  name: fastapi

spec:
  replicas: {{ .Values.fastapi.replicaCount }}

  selector:
    matchLabels:
      app: fastapi

  template:
    metadata:
      labels:
        app: fastapi

    spec:
      containers:
        - name: fastapi

          image: "{{ .Values.fastapi.image.repository }}:{{ .Values.fastapi.image.tag }}"
          imagePullPolicy: Never
          
          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: {{ .Values.resources.fastapi.requests.cpu }}
              memory: {{ .Values.resources.fastapi.requests.memory }}

            limits:
              cpu: {{ .Values.resources.fastapi.limits.cpu }}
              memory: {{ .Values.resources.fastapi.limits.memory }}

          envFrom:
          - configMapRef:
              name: retail-platform-config
          - secretRef:
              name: retail-secret