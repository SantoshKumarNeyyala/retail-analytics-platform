# DENY ALL INGRESS + EGRESS

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: default-deny-all

spec:
  podSelector: {}

  policyTypes:
    - Ingress
    - Egress

---

# ALLOW STREAMLIT -> FASTAPI

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-streamlit-to-fastapi

spec:
  podSelector:
    matchLabels:
      app: fastapi

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: streamlit

      ports:
        - protocol: TCP
          port: 8000

---

# ALLOW FASTAPI -> REDIS

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-fastapi-to-redis

spec:
  podSelector:
    matchLabels:
      app: redis

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: fastapi

      ports:
        - protocol: TCP
          port: 6379